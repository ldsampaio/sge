# Phase 1 pin record: async-imap resolves to 0.11.3 (0.11 line per STACK.md).
# If 0.11 bridging hurts, documented fallback is sync `imap 2.x` on std::thread
# with the same public API (see 01-CONTEXT.md D-imap).
[package]
name = "sge"
version = "0.1.0"
default-run = "sge"
description = "SGE — Linux IMAP desktop client (UTFPR mail reader)"
authors = ["SGE contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sync_demo"
path = "src/bin/sync_demo.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-imap = "0.11"
async-native-tls = "0.5"
async-std = "1.13"
mail-parser = { version = "0.11", features = ["full_encoding"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
keyring = { version = "3", features = ["sync-secret-service"] }
# Phase 13 pin record: lettre resolves to 0.11.23 (0.11 line, MIT, established
# crate — github:lettre:release team + amousset; verified on docs.rs 2026-10-08).
# Default features already carry smtp-transport + pool + native-tls (aligns with
# the native-tls 0.2 pin above); fail-closed STARTTLS via starttls_relay.
lettre = "0.11"
zeroize = "1"
thiserror = "2"
chrono = "0.4"
futures = "0.3"
native-tls = "0.2"
ammonia = "4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
