name: CI

# Phase 5 bundle sketch (kept as comments here because tauri.conf.json
# strictly rejects unknown fields — tauri-build errors on them):
#   bundle.linux.deb.depends: [libwebkit2gtk-4.1-0, libgtk-3-0]
#   bundle.linux.appimage.bundleMediaFramework: true
#   bundle.targets: [deb, appimage]
# Release bundles build ONLY on ubuntu-22.04 (oldest-baseline glibc rule).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Frontend install
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Tracer assertion — app identity
        run: |
          test "$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['identifier'])")" = "br.edu.utfpr.sge"

      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Rust audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Rust check
        working-directory: src-tauri
        run: cargo check
